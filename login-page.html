<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Staff sign in · ShopCity</title>
  <style>
    :root {
      --bg: oklch(33.2% 0.205 27.5);
      --surface: oklch(52.8% 0.115 35.8);
      --fg: oklch(100% 0 0);
      --muted: oklch(93% 0.018 30);
      --border: oklch(82% 0.095 29 / 0.42);
      --accent: oklch(59.2% 0.218 29.2);
      --accent-soft: color-mix(in oklch, var(--accent) 30%, transparent);
      --fg-soft: color-mix(in oklch, var(--fg) 12%, transparent);
      --font-display: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      --font-mono: ui-monospace, 'SF Mono', Menlo, monospace;
      --radius: 12px;
      --radius-lg: 18px;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body { margin: 0; color: var(--fg); font-family: var(--font-body); background: var(--bg); -webkit-font-smoothing: antialiased; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    .auth-page { min-height: 100vh; position: relative; overflow: hidden; background: oklch(45% 0.22 28); }
    .auth-page::before, .auth-page::after { content: ''; position: absolute; pointer-events: none; }
    .auth-page::before { inset: 0; background: oklch(48% 0.24 28); clip-path: polygon(15% 0, 100% 0, 100% 40%, 8% 100%, 0 100%, 0 34%); }
    .auth-page::after { inset: 0; background: oklch(62% 0.19 42); clip-path: polygon(100% 22%, 100% 100%, 28% 100%, 100% 52%); opacity: .92; }
    .band { position: absolute; inset: -12% -14%; pointer-events: none; transform: rotate(-26deg); background: oklch(56% 0.22 35); opacity: .9; }
    .band.one { height: 24%; top: 45%; }
    .band.two { height: 15%; top: 73%; background: oklch(67% 0.20 53); opacity: .58; }
    .deep-edge { position: absolute; left: -12%; top: -8%; width: 23%; height: 120%; background: oklch(27% 0.20 28); transform: rotate(10deg); opacity: .84; }
    .auth-shell { position: relative; z-index: 1; min-height: 100vh; padding: 32px clamp(24px, 8.4vw, 120px) 48px; display: flex; flex-direction: column; }
    .auth-top { display: flex; align-items: center; gap: 44px; }
    .brand { display: inline-flex; align-items: center; gap: 8px; width: 132px; min-width: 132px; }
    .brand-mark { width: 30px; height: 30px; flex: 0 0 30px; }
    .brand-copy { display: grid; gap: 1px; line-height: 1; color: var(--fg); }
    .brand-name { font-size: 15px; font-weight: 800; letter-spacing: -.035em; }
    .brand-subtitle { font-size: 6.5px; font-weight: 700; letter-spacing: .045em; }
    .top-rule { height: 1px; flex: 1; background: color-mix(in oklch, var(--fg) 56%, transparent); }
    .auth-main { flex: 1; display: grid; place-items: center; padding: 54px 0 16px; }
    .auth-card { width: min(440px, 100%); padding: 30px 24px 28px; border: 1px solid var(--border); border-radius: var(--radius-lg); background: color-mix(in oklch, var(--surface) 76%, transparent); box-shadow: 0 22px 60px oklch(20% 0.13 25 / .18); backdrop-filter: blur(12px); }
    .auth-card h1 { margin: 0; font-size: clamp(25px, 3vw, 31px); line-height: 1.1; letter-spacing: -.035em; font-weight: 720; }
    .intro { margin: 5px 0 20px; color: var(--muted); font-size: 13px; line-height: 1.4; }
    .role-list { display: grid; gap: 0; padding: 11px 15px; margin-bottom: 25px; border-radius: 24px; background: color-mix(in oklch, var(--fg) 22%, transparent); }
    .role-option { display: grid; grid-template-columns: 17px 1fr; gap: 9px; align-items: start; padding: 6px 0; color: var(--fg); text-align: left; border: 0; background: transparent; }
    .role-option input { width: 14px; height: 14px; margin: 3px 0 0; accent-color: var(--fg); }
    .role-title { display: block; font-size: 14px; line-height: 1.2; }
    .role-detail { display: block; margin-top: 1px; color: color-mix(in oklch, var(--fg) 76%, transparent); font-size: 10px; line-height: 1.18; }
    .form { display: grid; gap: 13px; }
    .field { display: grid; gap: 7px; }
    .field label { font-size: 12px; color: var(--fg); }
    .input-wrap { position: relative; }
    .input { width: 100%; min-height: 41px; padding: 0 15px; border: 1px solid color-mix(in oklch, var(--fg) 12%, transparent); border-radius: 999px; background: var(--fg); color: oklch(25% .04 28); font-size: 12px; outline: none; }
    .input::placeholder { color: oklch(57% .02 28); }
    .input:focus { border-color: var(--fg); box-shadow: 0 0 0 3px color-mix(in oklch, var(--fg) 28%, transparent); }
    .input-wrap .input { padding-right: 46px; }
    .toggle { position: absolute; right: 5px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; display: grid; place-items: center; border: 0; border-radius: 50%; background: transparent; color: oklch(48% .025 28); }
    .toggle:hover { background: oklch(90% .02 28); color: oklch(25% .04 28); }
    .toggle:focus-visible, .role-option:focus-within, .forgot:focus-visible, .submit:focus-visible { outline: 3px solid color-mix(in oklch, var(--fg) 62%, transparent); outline-offset: 3px; }
    .forgot { justify-self: end; margin: -1px 2px 0; border: 0; background: transparent; color: var(--fg); font-size: 11px; text-decoration: underline; text-underline-offset: 3px; }
    .forgot:hover { color: var(--fg); opacity: .82; }
    .submit { width: 100%; min-height: 41px; margin-top: -1px; border: 1px solid var(--accent); border-radius: 999px; background: var(--accent); color: var(--fg); font-size: 13px; font-weight: 650; transition: background .15s ease, transform .05s ease; }
    .submit:hover { background: oklch(52% .218 29.2); }
    .submit:active { transform: translateY(1px); }
    .submit:disabled { cursor: wait; opacity: .7; }
    .notice { min-height: 18px; margin: 3px 2px 0; color: var(--muted); font-size: 11px; line-height: 1.35; }
    .notice.error { color: var(--fg); }
    @media (max-width: 620px) { .auth-shell { padding: 22px 18px 28px; } .auth-top { gap: 20px; } .brand { width: 132px; min-width: 132px; } .auth-main { padding-top: 34px; } .auth-card { padding: 25px 18px 22px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
  </style>
  <link rel="stylesheet" href="global.css" />
  <script src="prototype-ui.js" defer></script>
</head>
<body>
  <main class="auth-page" data-od-id="login-page">
    <div class="deep-edge" aria-hidden="true"></div><div class="band one" aria-hidden="true"></div><div class="band two" aria-hidden="true"></div>
    <div class="auth-shell">
      <header class="auth-top" data-od-id="login-header">
        <a class="brand" href="overview-dashboard.html" aria-label="ShopCity Supermarket home" data-od-id="brand-link">
          <img class="brand-mark" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'%3E%3Cpath d='M30 23c0-4 3-7 7-7h22c11 0 20 9 20 20 0 8-5 15-12 18 7 3 12 10 12 18 0 11-9 20-20 20H37c-4 0-7-3-7-7V70h18c6 0 10-4 10-10s-4-10-10-10H30V23Z' fill='white'/%3E%3Cpath d='M26 69c0-4 3-7 7-7h17v14H33c-4 0-7-3-7-7Z' fill='white' opacity='.94'/%3E%3C/svg%3E" width="96" height="96" alt="" />
          <span class="brand-copy"><span class="brand-name">SHOPCITY</span><span class="brand-subtitle">SUPERMARKET</span></span>
        </a><div class="top-rule" aria-hidden="true"></div>
      </header>
      <div class="auth-main">
        <section class="auth-card" data-od-id="staff-sign-in">
          <h1 data-od-id="login-heading">Staff sign in</h1>
          <p class="intro">Choose a staff account to open the workspace for that role.</p>
          <div class="role-list" data-od-id="role-selector" aria-label="Choose staff role">
            <label class="role-option"><input type="radio" name="role" value="CASHIER" checked /><span><span class="role-title">Cashier / Loyalty Staff</span><span class="role-detail">Register, capture receipts and redeem credit at the till.</span></span></label>
            <label class="role-option"><input type="radio" name="role" value="SUPERVISOR" /><span><span class="role-title">Supervisor</span><span class="role-detail">Approve high-value receipts, late claims and OTP overrides.</span></span></label>
            <label class="role-option"><input type="radio" name="role" value="ADMIN" /><span><span class="role-title">Administrator</span><span class="role-detail">Programme configuration, wallet, campaigns and audit.</span></span></label>
            <label class="role-option"><input type="radio" name="role" value="OWNER" /><span><span class="role-title">Owner</span><span class="role-detail">Liability, reconciliation and programme performance.</span></span></label>
          </div>
          <form class="form" id="login-form" data-od-id="login-form" novalidate>
            <div class="field"><label for="email">Email Address</label><input class="input" id="email" name="username" type="email" placeholder="Enter your email address" autocomplete="username" required /></div>
            <div class="field"><label for="password">Password</label><div class="input-wrap"><input class="input" id="password" name="password" type="password" placeholder="Enter password" autocomplete="current-password" required /><button class="toggle" id="toggle-password" type="button" aria-label="Show password" data-od-id="password-toggle"><span data-sc-icon="eyeOff" aria-hidden="true"></span></button></div></div>
            <button class="forgot" id="forgot-password" type="button" data-od-id="forgot-password">Forgot password?</button>
            <button class="submit" id="submit-login" type="submit" data-od-id="sign-in-cta">Sign In</button>
            <p class="notice" id="notice" aria-live="polite">Use your ShopCity staff credentials.</p>
          </form>
        </section>
      </div>
    </div>
  </main>
  <script>
    (() => {
      const form = document.getElementById('login-form');
      const password = document.getElementById('password');
      const toggle = document.getElementById('toggle-password');
      const submit = document.getElementById('submit-login');
      const notice = document.getElementById('notice');
      const routes = { CASHIER: '/cashier', SUPERVISOR: '/supervisor', ADMIN: '/admin' };
      toggle.addEventListener('click', () => {
        const visible = password.type === 'text';
        password.type = visible ? 'password' : 'text';
        toggle.setAttribute('aria-label', visible ? 'Show password' : 'Hide password');
      });
      document.getElementById('forgot-password').addEventListener('click', () => {
        notice.textContent = 'Password reset is managed by your ShopCity administrator.';
        notice.className = 'notice';
      });
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const username = document.getElementById('email').value.trim();
        const pass = password.value;
        if (!username || !pass || !/^\S+@\S+\.\S+$/.test(username)) {
          notice.textContent = 'Enter a valid email address and password to continue.';
          notice.className = 'notice error';
          return;
        }
        submit.disabled = true;
        submit.textContent = 'Signing in…';
        notice.textContent = 'Checking your ShopCity session…';
        notice.className = 'notice';
        try {
          const response = await fetch('/api/v1/auth/login', { method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password: pass }) });
          const payload = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(payload?.message || payload?.error?.message || 'Sign in failed. Check your credentials and try again.');
          const role = payload?.data?.user?.role || payload?.user?.role;
          if (!routes[role]) throw new Error('This account does not have an interactive workspace role.');
          notice.textContent = 'Signed in. Opening your workspace…';
          window.location.href = routes[role];
        } catch (error) {
          notice.textContent = error instanceof Error ? error.message : 'The session service is unavailable.';
          notice.className = 'notice error';
          submit.disabled = false;
          submit.textContent = 'Sign In';
        }
      });
    })();
  </script>
</body>
</html>
