name: Format customer search follow-up
on:
  push:
    branches:
      - fix/prototype-topbar-customer-lookup
    paths:
      - .github/workflows/format-customer-search-followup.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format affected files
        run: |
          npx prettier --write \
            src/modules/customers/customers.service.ts \
            apps/web/tests/workflow-routes.spec.ts
      - name: Commit formatting and remove temporary workflow
        run: |
          git config user.name 'ShopCity CI Formatter'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/format-customer-search-followup.yml
          git add src/modules/customers/customers.service.ts apps/web/tests/workflow-routes.spec.ts
          git commit -m 'style(web): format customer discovery regressions'
          git push
