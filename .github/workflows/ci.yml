name: ci

# Touch to re-register the workflow after Actions delivery issues.
# Retry touch to refresh GitHub Actions delivery.

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run prisma:generate
      - run: npm run format:check
      - run: npm run lint:src
      - run: npm run lint:test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run prisma:validate
      - run: npm run architecture:check
      - run: npm run test -- --runInBand
      - run: npm run test:coverage:critical
      - run: npm run openapi:lint
      - run: npm run openapi:diff
      - run: npm run client:generate
      - run: npm run client:typecheck
      - run: npm run openspec:validate
      - run: npm run verify:release-artifacts
      - run: npm run test:validation-scope
      - run: npm run validate:scope
      - name: Upload release evidence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sprint-3-halfway-release-evidence
          path: docs/release-evidence/sprint-3-halfway/**
      - run: git diff --exit-code -- docs/api/openapi.json
      - run: git diff --exit-code -- client/shopcity-client.ts

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm --prefix apps/web ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm --prefix apps/web run tokens:check
      - run: npm --prefix apps/web run lint
      - run: npm --prefix apps/web run typecheck
      - run: npm --prefix apps/web run a11y:test
      - run: npm --prefix apps/web run a11y:browser
      - run: npm --prefix apps/web run critical:test
      - run: npm --prefix apps/web run visual:test
      - run: npm --prefix apps/web run build

  docker:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: chmod +x ./scripts/verify-docker-image.sh ./docker-entrypoint.sh
      - run: npm run verify:docker-image
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_VERSION: ${{ github.ref_name }}

  gitnexus:
    name: GitNexus
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run gitnexus:smoke
      - name: Run GitNexus analysis
        run: npm run gitnexus:analyze

  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run prisma:generate
      - run: npm run test:e2e

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y redis-server
      - run: npm ci --ignore-scripts
      - run: npm run prisma:generate
      - run: npm run test:integration:prime
      - run: npm run test:integration
