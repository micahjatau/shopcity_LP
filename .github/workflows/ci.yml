name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run prisma:generate
      - run: npm run prisma:validate
      - run: npm run architecture:check
      - run: npm test -- --runInBand
      - run: npm run openapi:lint
      - run: npm run openapi:diff
      - run: git diff --exit-code -- docs/api/openapi.json

  gitnexus:
    name: GitNexus
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run gitnexus:smoke
      - name: Run GitNexus analysis
        continue-on-error: ${{ vars.GITNEXUS_ALLOW_FAILURE == 'true' }}
        run: npm run gitnexus:analyze

  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:e2e

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y redis-server
      - run: npm ci
      - run: npm run test:integration
