name: ci

# Touch to re-register the workflow after Actions delivery issues.
# Retry touch to refresh GitHub Actions delivery.

on:
  push:
  pull_request:

env:
  CANDIDATE_SHA: ${{ github.sha }}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Verify exact candidate SHA
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run prisma:generate
      - run: npm run format:check
      - run: npm run verify:prototype-reference
      - run: npm run test:prototype-reference
      - run: npm run lint:src
      - run: npm run lint:test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run prisma:validate
      - run: npm run architecture:check
      - run: npm run test -- --runInBand
      - run: npm run test:coverage:critical
      - run: npm run openapi:lint
      - run: npm run openapi:diff
      - run: npm run client:generate
      - run: npm run client:typecheck
      - run: npm run openspec:validate
      - run: npm run test:smoke-workflow-security
      - run: npm run verify:release-artifacts
      - run: npm run test:validation-scope
      - run: npm run validate:scope
      - name: Upload release evidence artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sprint-3-halfway-release-evidence
          path: docs/release-evidence/sprint-3-halfway/**
      - run: git diff --exit-code -- docs/api/openapi.json
      - run: git diff --exit-code -- client/shopcity-client.ts

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Verify exact candidate SHA
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm --prefix apps/web ci --ignore-scripts
      - run: npm --prefix apps/web exec -- playwright install --with-deps chromium
      - run: npm --prefix apps/web run tokens:check
      - run: npm --prefix apps/web run lint
      - run: npm --prefix apps/web run typecheck
      - run: npm --prefix apps/web run a11y:test
      - run: npm --prefix apps/web run a11y:browser
      - run: npm --prefix apps/web run critical:test
      - run: npm --prefix apps/web run build
      - run: npm --prefix apps/web run visual:test
      - name: Upload frontend visual evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-visual-evidence-${{ github.sha }}
          path: apps/web/test-results/**
          if-no-files-found: warn

  docker:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Verify exact candidate SHA
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: chmod +x ./scripts/verify-docker-image.sh ./docker-entrypoint.sh
      - run: npm run verify:docker-image
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_VERSION: ${{ github.ref_name }}

  gitnexus:
    name: GitNexus
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Verify exact candidate SHA
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node node_modules/@ladybugdb/core/install.js
      - run: npm run gitnexus:smoke
      - name: Run GitNexus analysis
        run: npm run gitnexus:analyze

  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Verify exact candidate SHA
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run prisma:generate
      - run: npm run test:e2e

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Verify exact candidate SHA
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y redis-server
      - run: npm ci --ignore-scripts
      - run: npm run prisma:generate
      - run: npm run test:integration:prime
      - run: npm run test:integration
