name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:fast

  gitnexus:
    name: GitNexus
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run gitnexus:smoke
      - name: Run GitNexus analysis
        env:
          GITNEXUS_ALLOW_FAILURE: ${{ vars.GITNEXUS_ALLOW_FAILURE || 'true' }}
        run: |
          if [ "${GITNEXUS_ALLOW_FAILURE}" = "true" ]; then
            npm run gitnexus:analyze || echo "GitNexus analysis failed, continuing because GITNEXUS_ALLOW_FAILURE=true"
          else
            npm run gitnexus:analyze
          fi

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y redis-server
      - run: npm ci
      - run: npm run test:integration
