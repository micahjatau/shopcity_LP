name: security-gates

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      staging_base_url:
        description: Approved staging base URL for ZAP baseline
        required: false
        type: string

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run prisma:generate
      - run: npm run build
      - uses: github/codeql-action/analyze@v3
        with:
          upload: false

  trivy:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build candidate image
        run: |
          docker build \
            --build-arg RELEASE_SHA="${GITHUB_SHA}" \
            --build-arg RELEASE_VERSION="${GITHUB_REF_NAME}" \
            -t shopcity-lp:${GITHUB_SHA} .
          IMAGE_DIGEST="$(docker image inspect --format='{{.Id}}' shopcity-lp:${GITHUB_SHA})"
          test -n "$IMAGE_DIGEST"
          echo "IMAGE_DIGEST=$IMAGE_DIGEST" >> "$GITHUB_ENV"
          printf '%s\n' "$IMAGE_DIGEST" > "$RUNNER_TEMP/shopcity-trivy-image-digest.txt"
      - uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.IMAGE_DIGEST }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
      - name: Upload scanned image digest
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-digest-${{ github.sha }}
          path: ${{ runner.temp }}/shopcity-trivy-image-digest.txt
          retention-days: 14

  zap-baseline:
    name: ZAP Baseline (approved staging only)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.staging_base_url != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Enforce approved staging target
        run: |
          case "${{ inputs.staging_base_url }}" in
            https://*) ;;
            *) echo "staging_base_url must be an approved https staging target" >&2; exit 1 ;;
          esac
          case "${{ inputs.staging_base_url }}" in
            *localhost*|*127.0.0.1*|*0.0.0.0*)
              echo "localhost targets are not allowed" >&2
              exit 1
              ;;
          esac
      - uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ inputs.staging_base_url }}
          fail_action: true
          allow_issue_writing: false
          cmd_options: '-I'
