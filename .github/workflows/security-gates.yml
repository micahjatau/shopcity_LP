name: security-gates

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      staging_base_url:
        description: Exact approved staging origin for ZAP baseline
        required: true
        type: string

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: github/codeql-action/init@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        with:
          languages: javascript-typescript
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run prisma:generate
      - run: npm run build
      - uses: github/codeql-action/analyze@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        with:
          upload: false

  trivy:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build and publish candidate image to local registry
        run: |
          docker run --detach --rm --publish 5000:5000 --name shopcity-trivy-registry registry:2
          docker build \
            --build-arg RELEASE_SHA="${GITHUB_SHA}" \
            --build-arg RELEASE_VERSION="${GITHUB_REF_NAME}" \
            -t localhost:5000/shopcity-lp:${GITHUB_SHA} .
          docker push localhost:5000/shopcity-lp:${GITHUB_SHA}
          IMAGE_DIGEST="$(docker image inspect --format='{{index .RepoDigests 0}}' localhost:5000/shopcity-lp:${GITHUB_SHA})"
          case "$IMAGE_DIGEST" in
            localhost:5000/shopcity-lp@sha256:*) ;;
            *) echo "Unexpected image digest: $IMAGE_DIGEST" >&2; exit 1 ;;
          esac
          echo "IMAGE_DIGEST=$IMAGE_DIGEST" >> "$GITHUB_ENV"
          printf '%s\n' "$IMAGE_DIGEST" > "$RUNNER_TEMP/shopcity-trivy-image-digest.txt"
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ env.IMAGE_DIGEST }}
          format: table
          exit-code: '1'
          # Unfixed advisories are inventoried and reviewed separately; every
          # fixable HIGH/CRITICAL finding blocks this gate. Re-run this scan
          # when vendor fixes publish so newly fixable findings become blocking.
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
      - name: Upload scanned image digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-image-digest-${{ github.sha }}
          path: ${{ runner.temp }}/shopcity-trivy-image-digest.txt
          retention-days: 14

  zap-baseline:
    name: ZAP Baseline (approved staging only)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Enforce approved staging target
        env:
          STAGING_BASE_URL: ${{ inputs.staging_base_url }}
          APPROVED_STAGING_ORIGIN: ${{ vars.APPROVED_STAGING_ORIGIN }}
        run: |
          test -n "$STAGING_BASE_URL"
          test -n "$APPROVED_STAGING_ORIGIN"
          test "$STAGING_BASE_URL" = "$APPROVED_STAGING_ORIGIN"
          case "$STAGING_BASE_URL" in
            https://*) ;;
            *) echo "staging_base_url must be an approved https staging target" >&2; exit 1 ;;
          esac
          case "$STAGING_BASE_URL" in
            *localhost*|*127.0.0.1*|*0.0.0.0*)
              echo "localhost targets are not allowed" >&2
              exit 1
              ;;
          esac
      - uses: zaproxy/action-baseline@7c4deb10e6261301961c86d65d54a516394f9aed # v0.14.0
        with:
          target: ${{ inputs.staging_base_url }}
          fail_action: true
          allow_issue_writing: false
          cmd_options: '-I'
