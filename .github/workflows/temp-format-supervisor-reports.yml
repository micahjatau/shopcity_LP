name: Temporary supervisor reporting formatter

on:
  push:
    branches:
      - feat/supervisor-operational-report-dashboard

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/supervisor-operational-report-dashboard
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format the three affected files with repository Prettier
        run: |
          npx prettier --write apps/web/components/workflows/supervisor-operational-reports.tsx apps/web/lib/reports/supervisor-report-metrics.ts apps/web/tests/supervisor-operational-reports.spec.tsx
      - name: Commit only the formatted reporting files
        run: |
          if git diff --quiet -- apps/web/components/workflows/supervisor-operational-reports.tsx apps/web/lib/reports/supervisor-report-metrics.ts apps/web/tests/supervisor-operational-reports.spec.tsx; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/components/workflows/supervisor-operational-reports.tsx apps/web/lib/reports/supervisor-report-metrics.ts apps/web/tests/supervisor-operational-reports.spec.tsx
          git commit -m "style(web): format supervisor reporting with project Prettier"
          git push origin HEAD:refs/heads/feat/supervisor-operational-report-dashboard
