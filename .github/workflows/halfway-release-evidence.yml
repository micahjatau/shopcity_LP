name: halfway-release-evidence

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact immutable release commit SHA
        required: true
        type: string
      backup_reference:
        description: Approved backup artifact reference
        required: true
        type: string

jobs:
  protected-restore:
    name: Protected shared-backup restore
    runs-on: ubuntu-latest
    environment: halfway-production-release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ inputs.release_sha }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run prisma:generate
      - name: Verify exact release SHA
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - name: Download approved backup artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BACKUP_REFERENCE: ${{ inputs.backup_reference }}
        run: |
          test -n "$BACKUP_REFERENCE"
          backup_dir="$(mktemp -d)"
          curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${BACKUP_REFERENCE}/zip" \
            -o "${backup_dir}/backup.zip"
          unzip -q "${backup_dir}/backup.zip" -d "${backup_dir}"
          schema_dump_path="$(find "${backup_dir}" -name '*schema*.sql' -print -quit)"
          data_dump_path="$(find "${backup_dir}" -name '*data*.sql' -print -quit)"
          test -s "${schema_dump_path}"
          test -s "${data_dump_path}"
          echo "SHOPCITY_SHARED_SCHEMA_DUMP_PATH=${schema_dump_path}" >> "$GITHUB_ENV"
          echo "SHOPCITY_SHARED_DATA_DUMP_PATH=${data_dump_path}" >> "$GITHUB_ENV"
          echo "SHOPCITY_BACKUP_REFERENCE=${BACKUP_REFERENCE}" >> "$GITHUB_ENV"
          echo "SHOPCITY_BACKUP_CHECKSUM=$(sha256sum "${backup_dir}/backup.zip" | awk '{print $1}')" >> "$GITHUB_ENV"
      - name: Prepare evidence directory
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          mkdir -p "test-results/halfway-release/${RELEASE_SHA}"
      - name: Run protected shared-backup restore
        run: |
          npx jest test/financial-repair-restore.int-spec.ts --config ./test/jest-int.json --runInBand -t "protected shared-backup"
      - name: Collect restore evidence
        if: always()
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          evidence_dir="test-results/halfway-release/${RELEASE_SHA}"
          cp /tmp/opencode/repo-review-34-migration-reconciliation.json "${evidence_dir}/migration-reconciliation.json"
          cp /tmp/opencode/repo-review-34-object-probes.json "${evidence_dir}/object-probes.json"
          cp /tmp/opencode/repo-review-34-backup-checksum.txt "${evidence_dir}/backup-checksum.txt"
          cp /tmp/opencode/repo-review-34-prisma-status.txt "${evidence_dir}/prisma-status.txt"
          cp /tmp/opencode/repo-review-34-final-outcome.json "${evidence_dir}/final-outcome.json"
          cp docs/release-evidence/sprint-3-halfway/README.md "${evidence_dir}/README.md"
          cat > "${evidence_dir}/validation-summary.json" <<'JSON'
          {
            "releaseSha": "${RELEASE_SHA}",
            "reviewer": "OpenCode",
            "reviewDate": "${{ github.run_id }}",
            "localValidation": [
              {
                "command": "npx jest test/financial-repair-restore.int-spec.ts --config ./test/jest-int.json --runInBand -t \"protected shared-backup\"",
                "status": "passed"
              },
              {
                "command": "npx prisma migrate status",
                "status": "passed"
              }
            ],
            "pendingExternalEvidence": []
          }
          JSON
      - name: Verify restore evidence
        if: always()
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          npm run verify:halfway-release-evidence -- --evidence-dir "test-results/halfway-release/${RELEASE_SHA}" --release-sha "${RELEASE_SHA}"
      - name: Upload restore evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: halfway-release-evidence-${{ inputs.release_sha }}
          path: |
            test-results/halfway-release/${{ inputs.release_sha }}/**
