name: staging-smoke

on:
  workflow_run:
    workflows: ['ci']
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      candidate_sha:
        required: true
        type: string

concurrency:
  group: shopcity-staging-smoke-${{ github.event.workflow_run.head_sha || inputs.candidate_sha }}
  cancel-in-progress: true

jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: staging
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
        with:
          # Checkout the dispatch ref; Verify candidate SHA below still pins the run to the requested commit.
          # This avoids actions/checkout treating an unadvertised commit SHA as a branch name.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.workflow_run.head_sha || inputs.candidate_sha || github.sha }}
      - name: Verify candidate SHA
        env:
          CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha || inputs.candidate_sha }}
        run: |
          test "${CANDIDATE_SHA}" = "$(git rev-parse HEAD)"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --prefix apps/web ci --ignore-scripts
      - run: npm --prefix apps/web exec -- playwright install --with-deps chromium
      - name: Verify deployed staging provenance
        env:
          CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha || inputs.candidate_sha }}
          DEPLOYED_FRONTEND_SHA: ${{ vars.SMOKE_DEPLOYED_FRONTEND_SHA }}
          DEPLOYED_BACKEND_SHA: ${{ vars.SMOKE_DEPLOYED_BACKEND_SHA }}
        run: |
          test "$DEPLOYED_FRONTEND_SHA" = "$CANDIDATE_SHA"
          test "$DEPLOYED_BACKEND_SHA" = "$CANDIDATE_SHA"
      - name: Start staging outbox worker
        env:
          DATABASE_URL: ${{ secrets.SMOKE_WORKER_DATABASE_URL }}
          REDIS_URL: redis://127.0.0.1:6379
          NODE_ENV: staging
          DEFAULT_PUBLIC_TENANT_ID: ${{ vars.SMOKE_TENANT_ID }}
          DEFAULT_PUBLIC_BRANCH_ID: ${{ vars.SMOKE_BRANCH_ID }}
          CORS_ORIGIN_ALLOWLIST: ${{ secrets.SMOKE_FRONTEND_URL }}
          # The worker does not call Supabase, but the shared environment schema
          # requires these values. Keep them worker-local and non-production.
          SUPABASE_URL: https://worker-unused.supabase.co
          SUPABASE_ANON_KEY: staging-smoke-worker-unused-anon-key
          SUPABASE_SERVICE_ROLE_KEY: staging-smoke-worker-unused-service-role-key
          SMS_PROVIDER_MODE: deterministic
          OUTBOX_PUBLISH_BATCH_SIZE: '100'
          OUTBOX_PUBLISH_INTERVAL_MS: '250'
          OUTBOX_RETRY_DELAY_MS: '1000'
          OUTBOX_RECOVERY_THRESHOLD_MS: '1000'
        run: |
          export DEVICE_ATTESTATION_KEK="$(openssl rand -hex 32)"
          export SESSION_SECRET="staging-smoke-worker-session-secret"
          export CSRF_SECRET="staging-smoke-worker-csrf-secret"
          nohup npm run start:worker > /tmp/shopcity-staging-worker.log 2>&1 &
          echo $! > /tmp/shopcity-staging-worker.pid
          sleep 5
          kill -0 "$(cat /tmp/shopcity-staging-worker.pid)"
      - name: Run staging smoke
        env:
          SMOKE_ENVIRONMENT: staging
          SMOKE_FRONTEND_URL: ${{ secrets.SMOKE_FRONTEND_URL }}
          SMOKE_BACKEND_URL: ${{ secrets.SMOKE_BACKEND_URL }}
          SMOKE_CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha || inputs.candidate_sha }}
          SMOKE_FIXTURE_MANIFEST_VERSION: ${{ vars.SMOKE_FIXTURE_MANIFEST_VERSION }}
          SMOKE_TENANT_ID: ${{ vars.SMOKE_TENANT_ID }}
          SMOKE_BRANCH_ID: ${{ vars.SMOKE_BRANCH_ID }}
          SMOKE_DEVICE_ID: ${{ vars.SMOKE_DEVICE_ID }}
          SMOKE_ACTIVE_CUSTOMER_ID: ${{ vars.SMOKE_ACTIVE_CUSTOMER_ID }}
          SMOKE_ACTIVE_CARD_SERIAL: ${{ vars.SMOKE_ACTIVE_CARD_SERIAL }}
          SMOKE_INACTIVE_CUSTOMER_ID: ${{ vars.SMOKE_INACTIVE_CUSTOMER_ID }}
          SMOKE_INACTIVE_CARD_SERIAL: ${{ vars.SMOKE_INACTIVE_CARD_SERIAL }}
          SMOKE_STAFF_CUSTOMER_ID: ${{ vars.SMOKE_STAFF_CUSTOMER_ID }}
          SMOKE_STAFF_CARD_SERIAL: ${{ vars.SMOKE_STAFF_CARD_SERIAL }}
          SMOKE_FRAUD_FLAG_ID: ${{ vars.SMOKE_FRAUD_FLAG_ID }}
          SMOKE_SPARE_CARD_SERIALS: ${{ vars.SMOKE_SPARE_CARD_SERIALS }}
          SMOKE_ADMIN_USER_ID: ${{ vars.SMOKE_ADMIN_USER_ID }}
          SMOKE_ADMIN_USERNAME: ${{ secrets.SMOKE_ADMIN_USERNAME }}
          SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
          SMOKE_SUPERVISOR_USER_ID: ${{ vars.SMOKE_SUPERVISOR_USER_ID }}
          SMOKE_SUPERVISOR_USERNAME: ${{ secrets.SMOKE_SUPERVISOR_USERNAME }}
          SMOKE_SUPERVISOR_PASSWORD: ${{ secrets.SMOKE_SUPERVISOR_PASSWORD }}
          SMOKE_CASHIER_USER_ID: ${{ vars.SMOKE_CASHIER_USER_ID }}
          SMOKE_CASHIER_USERNAME: ${{ secrets.SMOKE_CASHIER_USERNAME }}
          SMOKE_CASHIER_PASSWORD: ${{ secrets.SMOKE_CASHIER_PASSWORD }}
          SMOKE_CASHIER_DEVICE_ID: ${{ vars.SMOKE_DEVICE_ID }}
          SMOKE_CASHIER_DEVICE_ATTESTATION_SECRET: ${{ secrets.SMOKE_CASHIER_DEVICE_ATTESTATION_SECRET }}
          SMOKE_SESSION_BOOTSTRAP_SECRET: ${{ secrets.SMOKE_SESSION_BOOTSTRAP_SECRET }}
        run: npm run smoke:staging
      - name: Verify smoke evidence
        if: success()
        env:
          CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha || inputs.candidate_sha }}
        run: |
          MANIFEST="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('apps/web/test-results/smoke/current-run.json','utf8')).outputDir + '/smoke-evidence.json')")"
          npm run verify:smoke-evidence -- --manifest "$MANIFEST" --candidate-sha "$CANDIDATE_SHA"
      - name: Stop staging outbox worker
        if: always()
        run: |
          if [ -f /tmp/shopcity-staging-worker.pid ]; then
            kill "$(cat /tmp/shopcity-staging-worker.pid)" 2>/dev/null || true
          fi
          if [ -f /tmp/shopcity-staging-worker.log ]; then
            tail -100 /tmp/shopcity-staging-worker.log
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shopcity-staging-smoke-${{ github.event.workflow_run.head_sha || inputs.candidate_sha }}
          path: apps/web/test-results/smoke/**
          retention-days: 14
